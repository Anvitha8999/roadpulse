name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Lockfiles match pyproject
        run: |
          uv lock --check --directory backend
          uv lock --check --directory model-service

      - name: Severity unit tests (no PyTorch needed)
        working-directory: model-service
        run: uvx pytest -q

      - name: Backend imports cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: uv run --frozen python -c "import app.main"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  infra:
    name: Helm and Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/roadpulse
      - run: helm template roadpulse deploy/helm/roadpulse > /dev/null
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform validate

  images:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [python, frontend, infra]
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify model weights
        env:
          WEIGHTS_URL: https://github.com/${{ github.repository }}/releases/download/weights-v1/best.pt
        run: |
          curl -fsSL -o model-service/weights/best.pt "$WEIGHTS_URL"
          sha256sum -c model-service/weights/best.pt.sha256

      - run: docker build -t roadpulse-backend:ci backend
      - run: docker build -t roadpulse-frontend:ci frontend
      - run: docker build -t roadpulse-model:ci model-service